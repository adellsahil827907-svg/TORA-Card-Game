
name: Build TORA APK
# Rebuild requested to provide a fresh release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/main.dart'
      - 'TORA_Sahil_Fixed.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build TORA Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f TORA_Sahil_Fixed.zip
          test -f lib/main.dart
          test -f google-services.json

      - name: Extract TORA project
        run: |
          mkdir source
          unzip -q TORA_Sahil_Fixed.zip -d source

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name tora_app project
          cp -r source/TORA_Flutter_Starter/lib project/
          cp source/TORA_Flutter_Starter/pubspec.yaml project/

      - name: Generate Royal Black and Gold Android launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          
          res = Path("project/android/app/src/main/res")
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          
          def make_icon(size, transparent=False):
              bg = (0, 0, 0, 0) if transparent else (9, 10, 14, 255)
              im = Image.new("RGBA", (size, size), bg)
              d = ImageDraw.Draw(im)
              gold = (255, 211, 106, 255)
              pale = (255, 231, 160, 255)
              dark = (18, 13, 7, 255)
              muted = (155, 104, 27, 255)
              m = int(size * .08)
              d.rounded_rectangle((m, m, size-m, size-m), radius=int(size*.17), outline=gold, width=max(2,size//42))
              m2 = int(size * .14)
              d.rounded_rectangle((m2, m2, size-m2, size-m2), radius=int(size*.12), outline=muted, width=max(1,size//90))
              # Queen's three-point crown.
              crown = [(int(size*.29),int(size*.34)),(int(size*.25),int(size*.20)),
                       (int(size*.39),int(size*.27)),(int(size*.50),int(size*.12)),
                       (int(size*.61),int(size*.27)),(int(size*.75),int(size*.20)),
                       (int(size*.71),int(size*.34))]
              d.polygon(crown, fill=gold)
              d.rounded_rectangle((int(size*.29),int(size*.33),int(size*.71),int(size*.39)),
                                  radius=max(2,size//90), fill=muted)
              # Hair silhouette, face and royal shoulders.
              d.ellipse((int(size*.34),int(size*.34),int(size*.66),int(size*.66)), fill=muted)
              d.ellipse((int(size*.40),int(size*.39),int(size*.60),int(size*.61)), fill=pale)
              d.polygon([(int(size*.29),int(size*.73)),(int(size*.34),int(size*.62)),
                         (int(size*.44),int(size*.58)),(int(size*.50),int(size*.66)),
                         (int(size*.56),int(size*.58)),(int(size*.66),int(size*.62)),
                         (int(size*.71),int(size*.73))], fill=gold)
              d.polygon([(int(size*.43),int(size*.60)),(int(size*.50),int(size*.69)),
                         (int(size*.57),int(size*.60)),(int(size*.54),int(size*.75)),
                         (int(size*.46),int(size*.75))], fill=dark)
              # Queen of Spades emblem at the base.
              cx, cy = size*.50, size*.82
              spade = [(cx,cy-size*.065),(cx-size*.075,cy),(cx-size*.045,cy+size*.045),
                       (cx,cy+size*.025),(cx+size*.045,cy+size*.045),(cx+size*.075,cy)]
              d.polygon([(int(x),int(y)) for x,y in spade], fill=pale)
              d.line((int(cx),int(cy+size*.02),int(cx),int(cy+size*.085)),
                     fill=gold, width=max(1,size//65))
              return im
          
          for density, pixels in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              make_icon(pixels).save(folder / "ic_launcher.png")
          
          foreground = res / "drawable-nodpi"
          foreground.mkdir(parents=True, exist_ok=True)
          make_icon(432, transparent=True).save(foreground / "ic_launcher_foreground.png")
          
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(chr(10).join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">',
              '    <background android:drawable="@color/tora_icon_background"/>',
              '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>',
              '</adaptive-icon>',
              ''
          ]))
          colors = res / "values"
          colors.mkdir(parents=True, exist_ok=True)
          (colors / "tora_icon_colors.xml").write_text(chr(10).join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources><color name="tora_icon_background">#090A0E</color></resources>',
              ''
          ]))
          manifest = Path("project/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          manifest.write_text(text)
          print("Royal Black & Gold TORA launcher icons generated.")
          PY

      - name: Apply new TORA code
        run: |
          cp lib/main.dart project/lib/main.dart
          mkdir -p project/assets
          cp assets/adell_sahil.png project/assets/adell_sahil.png
          python3 - <<'PY'
          from pathlib import Path
          pubspec = Path("project/pubspec.yaml")
          content = pubspec.read_text()
          marker = "  uses-material-design: true"
          asset_line = "  assets:\n    - assets/adell_sahil.png"
          if "assets/adell_sahil.png" not in content:
              if marker not in content:
                  raise SystemExit("Could not find Flutter assets section in pubspec.yaml")
              content = content.replace(marker, marker + "\n\n" + asset_line, 1)
              pubspec.write_text(content)
          PY

      - name: Configure Firebase Android SDK
        run: |
          mkdir -p project/android/app
          cp google-services.json project/android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("project/android/settings.gradle.kts")
          settings_text = settings.read_text()
          plugin_line = '    id("com.google.gms.google-services") version "4.6.0" apply false\n'
          if 'com.google.gms.google-services' not in settings_text:
              settings_text = settings_text.replace("plugins {\n", "plugins {\n" + plugin_line, 1)
              settings.write_text(settings_text)
          app_gradle = Path("project/android/app/build.gradle.kts")
          app_text = app_gradle.read_text()
          app_plugin = '    id("com.google.gms.google-services")\n'
          if 'id("com.google.gms.google-services")' not in app_text:
              app_text = app_text.replace("plugins {\n", "plugins {\n" + app_plugin, 1)
              app_gradle.write_text(app_text)
          PY

      - name: Add local profile storage dependency
        working-directory: project
        run: flutter pub add shared_preferences

      - name: Add Firebase Authentication and Facebook dependencies
        working-directory: project
        run: flutter pub add firebase_core firebase_auth flutter_facebook_auth


      - name: Configure Facebook Login
        working-directory: project
        env:
          FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
        run: |
          if [ -z "$FB_CLIENT_TOKEN" ]; then
            echo "::error::Add the Meta Client Token as the GitHub Actions repository secret FB_CLIENT_TOKEN, then rerun this workflow."
            exit 1
          fi
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/facebook_strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="facebook_app_id">1855587878967556</string>
              <string name="facebook_client_token">$FB_CLIENT_TOKEN</string>
          </resources>
          EOF
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          app_id = '    <meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id" />'
          client = '    <meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token" />'
          if "com.facebook.sdk.ApplicationId" not in content:
              match = re.search(r"<application\b[^>]*>", content, flags=re.S)
              if not match:
                  raise SystemExit("Android application tag not found")
              metadata = "\n" + app_id + "\n" + client
              content = content[:match.end()] + metadata + content[match.end():]
              manifest.write_text(content)
          PY

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Disable incompatible release lint analysis
        run: |
          cat >> project/android/build.gradle.kts <<'EOF'

          // Work around an Android Lint parser crash in the current CI toolchain.
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Generate Android signing fingerprints
        working-directory: project/android
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew signingReport | tee signing-report.txt
          KEY_HASH="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | openssl sha1 -binary | openssl base64 -A)"
          {
            echo "### Android Facebook Login setup"
            echo "Package name: com.example.tora_app"
            echo "Default activity: com.example.tora_app.MainActivity"
            echo "Debug key hash: $KEY_HASH"
            echo
            echo "### Android signing fingerprints"
            grep -E 'Variant:|SHA1:|SHA-1:' signing-report.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload TORA APK
        uses: actions/upload-artifact@v4
        with:
          name: TORA-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
