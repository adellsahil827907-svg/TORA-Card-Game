
name: Build TORA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/main.dart'
      - 'TORA_Sahil_Fixed.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build TORA Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f TORA_Sahil_Fixed.zip
          test -f lib/main.dart

      - name: Extract TORA project
        run: |
          mkdir source
          unzip -q TORA_Sahil_Fixed.zip -d source

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name tora_app project
          cp -r source/TORA_Flutter_Starter/lib project/
          cp source/TORA_Flutter_Starter/pubspec.yaml project/

      - name: Apply new TORA code
        run: |
          cp lib/main.dart project/lib/main.dart
          mkdir -p project/assets
          cp assets/adell_sahil.png project/assets/adell_sahil.png
          python3 - <<'PY'
          from pathlib import Path
          pubspec = Path("project/pubspec.yaml")
          content = pubspec.read_text()
          marker = "  uses-material-design: true"
          asset_line = "  assets:\n    - assets/adell_sahil.png"
          if "assets/adell_sahil.png" not in content:
              if marker not in content:
                  raise SystemExit("Could not find Flutter assets section in pubspec.yaml")
              content = content.replace(marker, marker + "\n\n" + asset_line, 1)
              pubspec.write_text(content)
          PY

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build release APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload TORA APK
        uses: actions/upload-artifact@v4
        with:
          name: TORA-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
